[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "route-estimator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "jpholiday==1.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
